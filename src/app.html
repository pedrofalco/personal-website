<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<title>Pedro Falco - Creative Developer and Designer</title>
		<meta name="title" content="Pedro Falco - Creative Developer and Designer from Buenos Aires, Argentina" />

		<meta name="robots" content="index, follow" />
		<meta name="author" content="Pedro Falco" />
		
		<!-- Open Graph / Facebook -->

		<meta property="og:url" content="https://pedrofalco.com/" />
		<meta property="og:title" content="Pedro Falco - Creative Developer and Designer" />
		<meta property="og:description" content="Creative developer focused on interactive experiences, digital art, and web development. Based in Buenos Aires, Argentina." />
		<meta property="og:image" content="https://pedrofalco.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Pedro Falco" />

		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://pedrofalco.com/" />

		<meta property="twitter:description" content="Creative developer focused on interactive experiences, digital art, and web development. Based in Buenos Aires, Argentina." />
		<meta property="twitter:image" content="https://pedrofalco.com/og-image.png" />
		
		%sveltekit.head%
	</head>
